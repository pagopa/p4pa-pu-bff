openapi: 3.0.1
info:
  title: API Documentation
  description: OpenAPI documentation
  version: 1.0.0
servers:
  - url: "http://localhost:8080/bff"
    description: Generated server url
paths:
  /organizations:
    get:
      tags:
        - Organizations
      summary: "Retrieve the list of organizations"
      operationId: getOrganizations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDTO'
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /brokers/config:
    get:
      tags:
        - Brokers
      summary: "Retrieve application information for FE"
      operationId: getBrokerConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigFE'
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
  /debt-position-types/{organizationId}:
    get:
      tags:
        - DebtPositionType
      summary: "Retrieve a page of DebtPositionTypeWithCount based on the organization's brokerId"
      operationId: getDebtPositionTypeWithCount
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDebtPositionTypeWithCount'
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
      x-spring-paginated: true
  /token:
    post:
      tags:
        - Authentication
      summary: "Generate an access token"
      operationId: postToken
      security: []
      parameters:
        - name: idToken
          in: query
          required: true
          schema:
            type: string
          description: ID token from the client
      responses:
        '200':
          description: Access Token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenDTO'
        '400':
          description: Invalid request
        '401':
          description: Authentication failed
        '429':
          description: Too many requests
        '500':
          description: Internal Server Error
  /core-health:
    get:
      tags:
        - Monitoring
      operationId: getHealthStatus
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceStatus'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceStatus'
  /taxonomy/getOrganizationTypes:
    get:
      tags:
        - Taxonomy
      summary: "Retrieve distinct organization types for FE"
      operationId: getOrganizationTypes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyOrganizationTypeDTO'
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
  /taxonomy/getMacroArea:
    get:
      tags:
        - Taxonomy
      operationId: getMacroArea
      parameters:
        - name: organizationType
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyMacroAreaCodeDTO'
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
  /taxonomy/getServiceType:
    get:
      tags:
        - Taxonomy
      operationId: getServiceType
      parameters:
        - name: organizationType
          in: query
          schema:
            type: string
        - name: macroAreaCode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyServiceTypeCodeDTO'
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
  /taxonomy/getCollectionReason:
    get:
      tags:
        - Taxonomy
      operationId: getCollectionReason
      parameters:
        - name: organizationType
          in: query
          schema:
            type: string
        - name: macroAreaCode
          in: query
          schema:
            type: string
        - name: serviceTypeCode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyCollectionReasonDTO'
        '401':
          description: Unauthorized - Missing or invalid token
        '403':
          description: Forbidden - Access denied
        '500':
          description: Internal Server Error
  /taxonomy/getTaxonomyCode:
    get:
      tags:
        - Taxonomy
      operationId: getTaxonomyCode
      parameters:
        - name: organizationType
          in: query
          schema:
            type: string
        - name: macroAreaCode
          in: query
          schema:
            type: string
        - name: serviceTypeCode
          in: query
          schema:
            type: string
        - name: collectionReason
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyCodeDTO'
security:
  - bearerAuth: [ ]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TaxonomyCodeDTO:
      type: object
      properties:
        organizationType:
          type: string
        organizationTypeDescription:
          type: string
        macroAreaCode:
          type: string
        macroAreaName:
          type: string
        macroAreaDescription:
          type: string
        serviceTypeCode:
          type: string
        serviceType:
          type: string
        serviceTypeDescription:
          type: string
        collectionReason:
          type: string
        taxonomyCode:
          type: string
    TaxonomyCollectionReasonDTO:
      type: object
      properties:
        organizationType:
          type: string
        organizationTypeDescription:
          type: string
        macroAreaCode:
          type: string
        macroAreaName:
          type: string
        macroAreaDescription:
          type: string
        serviceTypeCode:
          type: string
        serviceType:
          type: string
        serviceTypeDescription:
          type: string
        collectionReason:
          type: string
    TaxonomyServiceTypeCodeDTO:
      type: object
      properties:
        organizationType:
          type: string
        organizationTypeDescription:
          type: string
        macroAreaCode:
          type: string
        macroAreaName:
          type: string
        macroAreaDescription:
          type: string
        serviceTypeCode:
          type: string
        serviceType:
          type: string
        serviceTypeDescription:
          type: string
    TaxonomyMacroAreaCodeDTO:
      type: object
      properties:
        organizationType:
          type: string
        organizationTypeDescription:
          type: string
        macroAreaCode:
          type: string
        macroAreaName:
          type: string
        macroAreaDescription:
          type: string
    TaxonomyOrganizationTypeDTO:
      type: object
      properties:
        organizationType:
          type: string
        organizationTypeDescription:
          type: string
    OrganizationDTO:
      type: object
      required:
        - organizationId
        - ipaCode
        - orgName
        - operatorRole
      properties:
        organizationId:
          type: integer
          format: int64
          description: Organization ID
        ipaCode:
          type: string
          description: IPA code of the organization
        orgName:
          type: string
          description: Organization name
        operatorRole:
          type: string
          enum:
            - ROLE_ADMIN
            - ROLE_OPER
          description: Operator role
        orgLogo:
          type: string
          format: base64
          description: Base64 encoded logo of the organization
    ConfigFE:
      type: object
      required:
        - headerAssistanceUrl
        - logoFooterImg
        - footerDescText
        - footerPrivacyInfoUrl
        - footerGDPRUrl
        - footerTermsCondUrl
        - footerAccessibilityUrl
        - brokerId
        - canManageUsers
      properties:
        headerAssistanceUrl:
          type: string
          description: URL for header assistance
        logoFooterImg:
          type: string
          description: URL for footer logo image
        footerDescText:
          type: string
          description: Description text for the footer
        footerPrivacyInfoUrl:
          type: string
          description: URL for privacy information in the footer
        footerGDPRUrl:
          type: string
          description: URL for GDPR information in the footer
        footerTermsCondUrl:
          type: string
          description: URL for terms and conditions in the footer
        footerAccessibilityUrl:
          type: string
          description: URL for accessibility information in the footer
        brokerId:
          type: string
          description: Broker ID
        canManageUsers:
          type: boolean
          description: Indicates if the user can manage other users
    ServiceStatus:
      type: object
      properties:
        serviceName:
          type: string
          description: Service Name
        statusMessage:
          type: string
          description: Service status
    ErrorDTO:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          description: The title describing the error
        description:
          type: string
          description: Description of the error
    AccessTokenDTO:
      type: object
      properties:
        accessToken:
          type: string
          description: The access token
        tokenType:
          type: string
          example: Bearer
          description: The type of the token
        expiresIn:
          type: integer
          description: Time in seconds until the token expires
    PagedDebtPositionTypeWithCount:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DebtPositionTypeWithCount'
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
    DebtPositionTypeWithCount:
      type: object
      properties:
        debtPositionTypeId:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        updateDate:
          type: string
          format: date-time
        activeOrganizations:
          type: integer
          format: int32
