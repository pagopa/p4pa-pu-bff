  /token:
    post:
      tags:
        - Authentication
      summary: "Generate an access token"
      operationId: postToken
      security: [ ]
      parameters:
        - name: idToken
          in: query
          required: true
          schema:
            type: string
          description: ID token from the client
      responses:
        '200':
          description: Access Token generated successfully
          content:
            application/json:
              schema:
                type: 'AccessToken'
        '400':
          description: Invalid request
        '401':
