<!DOCTYPE html>
<html lang="it">
<head>
    <title>Ricevuta</title>
    <link rel="stylesheet" href="styles/index.css" />
</head>
<body>


<div class="header">
    <img src="${logo}" alt="Logo Ente Creditore" class="logo" />
    <div class="org-name">${orgName}</div>
</div>

<div class="section">
    <div class="field"><span class="label">IUV:</span> ${iuv}</div>
</div>

<div class="section">
    <h2>Dati Debitore</h2>
    <div class="field"><span class="label">Nome:</span> ${debtorName}</div>
    <div class="field"><span class="label">Codice Fiscale:</span> ${debtorFiscalCode}</div>
</div>

<div class="section">
    <h2>Dettagli Pagamento</h2>
    <div class="field"><span class="label">Importo Pagato:</span> ${totalAmount}</div>
    <div class="field"><span class="label">Data Pagamento:</span> ${paymentDate}</div>
    <div class="field"><span class="label">PSP:</span> Banca ${pspName}</div>
    <div class="field"><span class="label">Commissioni Pagate:</span> ${feeAmount}</div>
</div>

</body>
</html>
