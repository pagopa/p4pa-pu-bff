<!DOCTYPE html>
<html lang="it">
<head>
  <title>Ricevuta di Pagamento PagoPA</title>
  <link rel="stylesheet" href="styles/index.css" />
</head>
<body>
<div class="header">
  <div class="ec-logo">
    <img src="${logo}" alt="Logo Ente Creditore" class="logo-image" />
  </div>
  <div class="header-text">
    <h1>RICEVUTA DI PAGAMENTO</h1>
  </div>
  <div class="pagopa-logo">
    <img src="static/images/pagoPA.png" alt="Logo PagoPA" class="logo-image" />
  </div>
</div>

<div class="transaction-section">
  <div>
    <div class="info-item">
      <div class="info-label">Data e ora</div>
      <div class="info-value">${paymentDate}</div>
    </div>
  </div>
</div>

<div class="divider"></div>

<div class="debtor-grid">
  <div class="info-item">
    <div class="info-label">Debitore</div>
    <div class="info-value">
      ${debtorName}<br></br>
      <span class="fiscal-code">${debtorFiscalCode}</span>
    </div>
  </div>

  <div class="info-item">
    <div class="info-label">Ente Creditore</div>
    <div class="info-value">
      ${orgName}<br></br>
      <span class="org-fiscal-code">${orgFiscalCode}</span>
    </div>
  </div>

  <div class="info-item">
    <div class="info-label">Codice avviso</div>
    <div class="info-value">
      <span class="payment-code">${iuv}</span>
    </div>
  </div>
</div>

<div class="amount-section-header">
  <div class="amount-header-label">Importo</div>
  <div class="amount-header-value">${amount}</div>
</div>

<div class="divider"></div>

<div class="amounts-section">
  <div class="amount-row">
    <div class="amount-label-psp">Commissione (applicata da ${pspName})</div>
    <div class="amount-value-fee">${feeAmount}</div>
  </div>

  <div class="amount-row total-row">
    <div class="amount-label">Totale</div>
    <div class="amount-value">${totalAmount}</div>
  </div>
</div>

</body>
</html>
